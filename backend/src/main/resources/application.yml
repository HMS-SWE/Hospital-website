spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy_secret}
            scope: openid, email, profile
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hospital_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${APP_JWT_SECRET:EverythingIsWorkingFineAndThisIsALongSecretKey2026}
    expiration: ${APP_JWT_EXPIRATION:3600000}